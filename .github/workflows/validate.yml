name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill, agent and templates
        run: python scripts/validate.py
      - name: Smoke-test install.sh into a temp HOME and project
        run: |
          export HOME="$(mktemp -d)"
          proj="$(mktemp -d)"
          sh ./install.sh "$proj"
          test -f "$HOME/.claude/skills/plan-implement-review/SKILL.md"
          test -f "$HOME/.claude/agents/implementer.md"
          test -f "$proj/vault/Status.md"
          test -f "$proj/CLAUDE.md"
          # second run must not overwrite existing project files
          echo "custom" > "$proj/CLAUDE.md"
          sh ./install.sh "$proj"
          grep -q custom "$proj/CLAUDE.md"
